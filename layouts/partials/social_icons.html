{{- /*
  Override of themes/PaperMod/layouts/partials/social_icons.html
  Change: adds a "toptal" icon (not in PaperMod's svg.html); all others fall through to the theme.
*/ -}}
<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{- if eq .name "toptal" }}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.5 0 30 30" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd">

        </svg>
        {{- else }}
        {{ partial "svg.html" . }}
        {{- end }}
    </a>
    {{- end }}
</div>
